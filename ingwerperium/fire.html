
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingwerperium Plant Game Online</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #111510;
      color: #d9e5d3;
      font-family: Consolas, monospace;
      font-size: 15px;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid #46543e;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    h2 {
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 14px;
    }

    button, input, select, textarea {
      font: inherit;
      border: 1px solid #627657;
      border-radius: 0;
      background: #192019;
      color: #e2ebdc;
      padding: 10px 12px;
    }

    button {
      cursor: pointer;
      background: #293a25;
    }

    button:hover {
      background: #3a5032;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    input, textarea {
      width: 100%;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #a3c18d;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .panel {
      border: 1px solid #46543e;
      padding: 18px;
      margin-bottom: 16px;
      background: #151c14;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
    }

    .small {
      color: #9eae96;
      font-size: 12px;
    }

    .status {
      color: #b7d69f;
      min-height: 20px;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none !important;
    }

    #question {
      font-size: 20px;
      line-height: 1.5;
      margin: 12px 0 20px;
    }

    .answers {
      display: grid;
      gap: 8px;
    }

    .answers button {
      text-align: left;
      width: 100%;
      background: #202a1d;
    }

    .answers button.correct {
      background: #31552b;
      border-color: #9bc58b;
    }

    .answers button.wrong {
      background: #542b27;
      border-color: #bd776e;
    }

    #feedback {
      min-height: 24px;
      margin: 14px 0;
    }

    .player {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #303c2b;
    }

    .online {
      color: #a9d58c;
    }

    .offline {
      color: #879080;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    a {
      color: #b8d69e;
    }

    @media (max-width: 550px) {
      body { padding: 12px; }
      .panel { padding: 13px; }
      header { align-items: flex-start; }
      h1 { font-size: 19px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Ingwerperium</h1>
    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>
  </header>

  <section class="panel" id="loginPanel">
    <h2 id="joinHeading">Join a game</h2>
    <label for="playerName" id="nameLabel">Player name</label>
    <input id="playerName" maxlength="25" placeholder="Your name">
    <br><br>
    <label for="roomCode" id="codeLabel">Room code (leave empty for World Server)</label>
    <input id="roomCode" maxlength="5" placeholder="Empty = World Server">
    <br><br>
    <div class="row">
      <button id="joinButton">Join</button>
      <button id="createButton">Create private room</button>
    </div>
    <div class="status" id="loginStatus"></div>
  </section>

  <section class="hidden" id="gameArea">
    <div class="panel">
      <div class="topline">
        <div><span id="roomLabel">Room:</span> <strong id="currentRoom"></strong></div>
        <div><span id="scoreLabel">Score:</span> <strong id="myScore">0</strong></div>
      </div>
      <div class="row">
        <button id="leaveButton">Leave room</button>
        <button id="nextButton">Next question</button>
      </div>
    </div>

    <section class="panel">
      <div class="small" id="quizLabel">Plant quiz</div>
      <div id="question">Loading question...</div>
      <div class="answers" id="answers"></div>
      <div id="feedback"></div>
    </section>

    <section class="panel">
      <h2 id="playersHeading">Players</h2>
      <div id="playerList"></div>
    </section>

    <section class="panel">
      <h2 id="importHeading">Add questions</h2>
      <p class="small" id="importHelp">
        One question per line: question;correct answer-wrong answer-wrong answer
      </p>
      <textarea id="questionImport" placeholder="What do plants absorb from the air?;Carbon dioxide-Oxygen-Nitrogen"></textarea>
      <br><br>
      <button id="importButton">Import questions</button>
      <div class="status" id="importStatus"></div>
    </section>
  </section>
</main>

  function shuffle(array) {
    const result = [...array];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function showStatus(element, message) {
    $(element).textContent = message;
  }

  function getName() {
    return $("playerName").value.trim().slice(0, 24);
  }

  function makeRoomCode() {
    return Math.random().toString(36).slice(2, 8).toUpperCase();
  }

  async function ensureWorldServer() {
    const ref = doc(db, "quizRooms", "world");
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      await setDoc(ref, {
        name: "World Server",
        type: "public",
        createdAt: serverTimestamp()
      });
    }

    return "world";
  }

  async function createPrivateRoom() {
    const name = getName();
    if (!name) {
      showStatus("loginStatus", t("enterName"));
      return;
    }

    showStatus("loginStatus", t("loading"));

    try {
      let code = makeRoomCode();
      let ref = doc(db, "quizRooms", code);

      while ((await getDoc(ref)).exists()) {
        code = makeRoomCode();
        ref = doc(db, "quizRooms", code);
      }

      await setDoc(ref, {
        name: "Private room",
        type: "private",
        createdAt: serverTimestamp()
      });

      await enterRoom(code, name);
      showStatus("loginStatus", t("privateCreated") + code);
    } catch (error) {
      showStatus("loginStatus", t("error") + error.message);
    }
  }

  async function joinRoom() {
    const name = getName();
    if (!name) {
      showStatus("loginStatus", t("enterName"));
      return;
    }

    showStatus("loginStatus", t("loading"));

    try {
      const code = $("roomCode").value.trim().toLowerCase();

      if (!code) {
        const worldId = await ensureWorldServer();
        await enterRoom(worldId, name);
        return;
      }

      const roomRef = doc(db, "quizRooms", code.toUpperCase());
      const roomSnap = await getDoc(roomRef);

      if (!roomSnap.exists()) {
        showStatus("loginStatus", t("roomMissing"));
        return;
      }

      await enterRoom(code.toUpperCase(), name);
    } catch (error) {
      showStatus("loginStatus", t("error") + error.message);
    }
  }

  async function enterRoom(code, name) {
    leaveRoom(false);

    roomId = code;
    playerRef = doc(db, "quizRooms", roomId, "players", user.uid);

    await setDoc(playerRef, {
      name,
      score: 0,
      lastSeen: Date.now(),
      joinedAt: serverTimestamp()
    }, { merge: true });

    myScore = 0;
    usedQuestions.clear();
    customQuestions = [];

    $("loginPanel").classList.add("hidden");
    $("gameArea").classList.remove("hidden");
    $("currentRoom").textContent = roomId === "world" ? t("world") : roomId;
    $("myScore").textContent = myScore;
    $("feedback").textContent = "";
    showStatus("loginStatus", t("joined"));

    playerListener = onSnapshot(
      collection(db, "quizRooms", roomId, "players"),
      snapshot => renderPlayers(snapshot)
    );

    questionListener = onSnapshot(
      collection(db, "quizRooms", roomId, "questions"),
      snapshot => {
        customQuestions = snapshot.docs.map(item => ({
          id: item.id,
          en: item.data().question,
          de: item.data().question,
          answers: item.data().answers,
          deAnswers: item.data().answers,
          custom: true
        }));
      },
      error => showStatus("importStatus", t("error") + error.message)
    );

    heartbeat = setInterval(() => {
      if (playerRef) {
        updateDoc(playerRef, { lastSeen: Date.now() }).catch(() => {});
      }
    }, 30000);

    updateTexts();
    nextQuestion();
  }

  function leaveRoom(showLogin = true) {
    if (playerListener) playerListener();
    if (questionListener) questionListener();
    if (heartbeat) clearInterval(heartbeat);

    playerListener = null;
    questionListener = null;
    heartbeat = null;
    roomId = null;
    playerRef = null;

    if (showLogin) {
      $("gameArea").classList.add("hidden");
      $("loginPanel").classList.remove("hidden");
    }
  }

  function renderPlayers(snapshot) {
    const players = snapshot.docs.map(item => item.data());
    players.sort((a, b) => (b.score || 0) - (a.score || 0));

    const list = $("playerList");
    list.replaceChildren();

    players.forEach(player => {
      const line = document.createElement("div");
      line.className = "player";

      const name = document.createElement("span");
      name.textContent = player.name || "Player";

      const details = document.createElement("span");
      const isOnline = Date.now() - (player.lastSeen || 0) < 90000;
      details.className = isOnline ? "online" : "offline";
      details.textContent = `${player.score || 0} pts · ${isOnline ? t("online") : t("offline")}`;

      line.append(name, details);
      list.append(line);

      if (playerRef && player.name === getName() && player.score !== undefined) {
        // The local score is updated when this player answers.
      }
    });
  }

  function allQuestions() {
    return [
      ...builtInQuestions.map((q, index) => ({ ...q, id: "built-" + index })),
      ...customQuestions
    ];
  }

  function nextQuestion() {
    const questions = allQuestions();

    if (!questions.length) {
      $("question").textContent = t("noQuestions");
      $("answers").replaceChildren();
      return;
    }

    let available = questions.filter(q => !usedQuestions.has(q.id));

    if (!available.length) {
      usedQuestions.clear();
      available = questions;
    }

    currentQuestion = available[Math.floor(Math.random() * available.length)];
    usedQuestions.add(currentQuestion.id);
    answered = false;

    $("feedback").textContent = "";
    $("nextButton").disabled = true;

    const questionText = lang === "de" ? currentQuestion.de : currentQuestion.en;
    $("question").textContent = questionText || currentQuestion.en;

    const answers = lang === "de"
      ? (currentQuestion.deAnswers || currentQuestion.answers)
      : currentQuestion.answers;

    const correctAnswer = answers[0];
    const shuffled = shuffle(answers.map((answer, index) => ({
      answer,
      correct: index === 0
    })));

    const answerBox = $("answers");
    answerBox.replaceChildren();

    shuffled.forEach(item => {
      const button = document.createElement("button");
      button.textContent = item.answer;
      button.addEventListener("click", () => chooseAnswer(button, item, correctAnswer));
      answerBox.append(button);
    });
  }

  async function chooseAnswer(button, item, correctAnswer) {
    if (answered) return;
    answered = true;

    const buttons = $("answers").querySelectorAll("button");
    buttons.forEach(btn => btn.disabled = true);

    if (item.correct) {
      button.classList.add("correct");
      $("feedback").textContent = t("correct");
      myScore += 1;
      $("myScore").textContent = myScore;

      try {
        await updateDoc(playerRef, {
          score: myScore,
          lastSeen: Date.now()
        });
      } catch (error) {
        showStatus("importStatus", t("error") + error.message);
      }
    } else {
      button.classList.add("wrong");
      $("feedback").textContent = t("incorrect") + correctAnswer;

      buttons.forEach(btn => {
        if (btn.textContent === correctAnswer) btn.classList.add("correct");
      });
    }

    $("nextButton").disabled = false;
  }

  async function importQuestions() {
    if (!roomId) return;

    const raw = $("questionImport").value.trim();
    if (!raw) return;

    const lines = raw.split(/\r?\n/).filter(line => line.trim());
    let imported = 0;
    const errors = [];

    for (const line of lines.slice(0, 100)) {
      const separator = line.indexOf(";");
      if (separator < 1) {
        errors.push(t("badLine") + line);
        continue;
      }

      const question = line.slice(0, separator).trim();
      const answers = line.slice(separator + 1).split("-").map(x => x.trim());

      if (!question || answers.length !== 3 || answers.some(x => !x)) {
        errors.push(t("badLine") + line);
        continue;
      }

      try {
        await addDoc(collection(db, "quizRooms", roomId, "questions"), {
          question,
          answers,
          createdBy: user.uid,
          createdAt: serverTimestamp()
        });
        imported++;
      } catch (error) {
        errors.push(error.message);
        break;
      }
    }

    $("questionImport").value = "";
    showStatus("importStatus", imported + t("imported") + (errors.length ? " " + errors.join(" | ") : ""));
  }

  function updateTexts() {
    $("joinHeading").textContent = t("joinHeading");
    $("nameLabel").textContent = t("nameLabel");
    $("codeLabel").textContent = t("codeLabel");
    $("playerName").placeholder = t("namePlaceholder");
    $("roomCode").placeholder = t("codePlaceholder");
    $("joinButton").textContent = t("join");
    $("createButton").textContent = t("create");
    $("roomLabel").textContent = t("room");
    $("scoreLabel").textContent = t("score");
    $("leaveButton").textContent = t("leave");
    $("nextButton").textContent = t("next");
    $("quizLabel").textContent = t("quiz");
    $("playersHeading").textContent = t("players");
    $("importHeading").textContent = t("importHeading");
    $("importHelp").textContent = t("importHelp");
    $("importButton").textContent = t("import");
  }

  $("language").addEventListener("change", event => {
    lang = event.target.value;
    updateTexts();
    if (currentQuestion && roomId) nextQuestion();
    if (roomId) {
      $("currentRoom").textContent = roomId === "world" ? t("world") : roomId;
    }
  });

  $("joinButton").addEventListener("click", joinRoom);
  $("createButton").addEventListener("click", createPrivateRoom);
  $("leaveButton").addEventListener("click", () => leaveRoom(true));
  $("nextButton").addEventListener("click", nextQuestion);
  $("importButton").addEventListener("click", importQuestions);

  updateTexts();

  try {
    await signInAnonymously(auth);
    user = auth.currentUser;
    showStatus("loginStatus", "");
  } catch (error) {
    showStatus("loginStatus", t("error") + error.message);
  }
</script>
</body>
</html>
